# Check Specification — Linux Technical Checks
# (Check↔KISA 관계는 data/mappings/kisa-to-check.yaml 에서 관리)
checks:
- id: CK-lnx-U01-001
  type: config_value
  description: SSH 서버의 root 직접 원격 접속 허용 여부 확인
  platforms:
  - linux
  automation: &id001
    observation: auto
    assessment: auto
  targets:
  - kind: config
    path: /etc/ssh/sshd_config
    key: PermitRootLogin
  expect:
    op: eq
    value: 'No'
    case_insensitive: true
  evidence:
  - kind: file
    path: /etc/ssh/sshd_config
    field: PermitRootLogin
- id: CK-lnx-U01-002
  type: service_status
  description: Telnet 원격터미널 서비스 사용 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: telnet
    port: 23
    mechanisms:
    - systemd
    - xinetd
    - inetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: telnet
- id: CK-lnx-U01-003
  type: config_value
  description: Telnet 사용 시 root 직접 접속 제한 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - id: pam
    kind: config
    path: /etc/pam.d/login
  - id: securetty
    kind: config
    path: /etc/securetty
  expect:
    all:
    - target: pam
      op: contains
      value: pam_securetty.so
    - target: securetty
      op: not_contains
      value: pts
  evidence:
  - kind: file
    path: /etc/pam.d/login
  - kind: file
    path: /etc/securetty
  precondition:
    ref: CK-lnx-U01-002
    type: service_status
    targets:
    - kind: service
      name: telnet
      port: 23
      mechanisms:
      - systemd
      - xinetd
      - inetd
    expect:
      op: eq
      value: enabled
- id: CK-lnx-U02-001
  type: config_value
  description: 비밀번호 관리 정책 설정 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/security/pwquality.conf
  expect:
    op: contains
    value: minlen
  evidence:
  - kind: file
    path: /etc/security/pwquality.conf
- id: CK-lnx-U03-001
  type: config_value
  description: 계정 잠금 임계값 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/pam.d/system-auth
  expect:
    op: contains
    value: deny=
  evidence:
  - kind: file
    path: /etc/pam.d/system-auth
- id: CK-lnx-U04-001
  type: config_value
  description: 쉐도우 비밀번호 적용 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/passwd
  expect:
    op: contains
    value: ':x:'
  evidence:
  - kind: file
    path: /etc/passwd
- id: CK-lnx-U05-001
  type: account_uid
  description: /etc/passwd에서 UID 0 계정의 존재 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: account
    source: /etc/passwd
    field: uid
    exclude:
    - root
  expect:
    op: not_in
    value:
    - 0
  evidence:
  - kind: account
    path: /etc/passwd
    field: uid
- id: CK-lnx-U06-001
  type: config_value
  description: su 명령어 제한 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/pam.d/su
  expect:
    op: contains
    value: pam_wheel.so
  evidence:
  - kind: file
    path: /etc/pam.d/su
- id: CK-lnx-U07-001
  type: account_uid
  description: 불필요한 계정 존재 여부 확인(사람 판단)
  platforms:
  - linux
  automation: &id002
    observation: auto
    assessment: human
  targets:
  - kind: account
    source: /etc/passwd
    field: uid
  expect:
    op: empty
  evidence:
  - kind: account
    path: /etc/passwd
    field: uid
- id: CK-lnx-U08-001
  type: account_group
  description: 관리자 그룹 멤버 구성 확인(사람 판단)
  platforms:
  - linux
  automation: *id002
  targets:
  - kind: group
    source: /etc/group
    name: wheel
  expect:
    op: empty
  evidence:
  - kind: account
    path: /etc/group
- id: CK-lnx-U09-001
  type: account_group
  description: 불필요한 그룹 존재 여부 확인(사람 판단)
  platforms:
  - linux
  automation: *id002
  targets:
  - kind: group
    source: /etc/group
  expect:
    op: empty
  evidence:
  - kind: account
    path: /etc/group
- id: CK-lnx-U10-001
  type: account_duplicate
  description: 중복 UID 존재 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: account
    source: /etc/passwd
    field: uid
  expect:
    op: empty
  evidence:
  - kind: account
    path: /etc/passwd
    field: uid
- id: CK-lnx-U11-001
  type: account_shell
  description: 로그인 불필요 계정의 쉘 제한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: account
    source: /etc/passwd
    field: shell
    names:
    - daemon
    - bin
    - sys
    - adm
    - listen
    - nobody
    - nobody4
    - noaccess
    - diag
    - operator
    - games
    - gopher
    restricted:
    - /bin/false
    - /sbin/nologin
  expect:
    op: empty
  evidence:
  - kind: account
    path: /etc/passwd
    field: shell
- id: CK-lnx-U12-001
  type: config_value
  description: 세션 종료 시간 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/profile
  expect:
    op: contains
    value: TMOUT
  evidence:
  - kind: file
    path: /etc/profile
- id: CK-lnx-U13-001
  type: config_value
  description: 비밀번호 암호화 알고리즘 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/login.defs
    key: ENCRYPT_METHOD
  expect:
    op: eq
    value: SHA512
  evidence:
  - kind: file
    path: /etc/login.defs
    field: ENCRYPT_METHOD
