# Check Specification — Linux Technical Checks
# (Check↔KISA 관계는 data/mappings/kisa-to-check.yaml 에서 관리)
checks:
- id: CK-lnx-U14-001
  type: config_value
  description: root PATH에 '.' 포함 여부 확인
  platforms:
  - linux
  automation: &id001
    observation: auto
    assessment: auto
  targets:
  - kind: config
    path: /root/.profile
  expect:
    op: not_contains
    value: :.
  evidence:
  - kind: file
    path: /root/.profile
- id: CK-lnx-U15-001
  type: file_scan
  description: 소유자가 없는 파일 존재 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: scan
    root: /
    recursive: true
    criteria: ownerless
  expect:
    op: empty
  evidence:
  - kind: file
    path: /
- id: CK-lnx-U16-001
  type: file_owner
  description: /etc/passwd 파일의 소유자 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: file
    path: /etc/passwd
    field: owner
  expect:
    op: eq
    value: root
  evidence:
  - kind: file
    path: /etc/passwd
    field: owner
- id: CK-lnx-U16-002
  type: file_mode
  description: /etc/passwd 파일의 Unix 권한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: file
    path: /etc/passwd
    field: mode
  expect:
    mode_allowed:
      owner: rw
      group: r
      other: r
  evidence:
  - kind: file
    path: /etc/passwd
    field: mode
- id: CK-lnx-U17-001
  type: file_scan
  description: 시스템 시작 스크립트 권한 확인
