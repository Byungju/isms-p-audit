  type: service_status
  description: NIS 서비스 비활성화 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: ypserv
    port: 0
    mechanisms:
    - systemd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: ypserv
- id: CK-lnx-U44-001
  type: service_status
  description: tftp/talk 서비스 비활성화 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: tftp
    port: 69
    mechanisms:
    - inetd
    - xinetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: tftp
- id: CK-lnx-U45-001
  type: package_version
  description: 메일 서비스 취약 버전 여부 확인
  platforms:
  - linux
  automation: &id002
    observation: auto
    assessment: external_data
  targets:
  - kind: package
    name: sendmail
  expect:
    op: ge
    value_ref:
      source: vendor_advisory
      item:
        package: sendmail
        platform: linux
  evidence:
  - kind: package
    field: version
    name: sendmail
- id: CK-lnx-U46-001
  type: config_value
  description: 일반 사용자 메일 실행 방지 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/mail/sendmail.cf
  expect:
    op: contains
    value: PrivacyOptions
  evidence:
  - kind: file
    path: /etc/mail/sendmail.cf
- id: CK-lnx-U47-001
  type: config_value
  description: 스팸 메일 릴레이 제한 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/mail/sendmail.cf
  expect:
    op: not_contains
    value: PromiscuousRelay
  evidence:
  - kind: file
    path: /etc/mail/sendmail.cf
- id: CK-lnx-U48-001
  type: config_value
  description: expn/vrfy 명령어 제한 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/mail/sendmail.cf
  expect:
    op: contains
    value: noexpn
  evidence:
  - kind: file
    path: /etc/mail/sendmail.cf
- id: CK-lnx-U49-001
  type: package_version
  description: DNS(BIND) 취약 버전 여부 확인
  platforms:
  - linux
  automation: *id002
  targets:
  - kind: package
    name: bind
  expect:
    op: ge
    value_ref:
      source: vendor_advisory
      item:
        package: bind
        platform: linux
  evidence:
  - kind: package
    field: version
    name: bind
- id: CK-lnx-U50-001
  type: config_value
  description: DNS Zone Transfer 제한 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/named.conf
  expect:
    op: contains
    value: allow-transfer
  evidence:
  - kind: file
    path: /etc/named.conf
- id: CK-lnx-U51-001
  type: config_value
  description: DNS 동적 업데이트 금지 설정 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/named.conf
  expect:
    op: not_contains
    value: allow-update
  evidence:
  - kind: file
    path: /etc/named.conf
- id: CK-lnx-U52-001
  type: service_status
  description: Telnet 서비스 비활성화 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: telnet
    port: 23
    mechanisms:
    - systemd
    - xinetd
    - inetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: telnet
- id: CK-lnx-U53-001
  type: config_value
  description: FTP 서비스 정보 노출 제한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/vsftpd/vsftpd.conf
  expect:
    op: contains
    value: ftpd_banner
  evidence:
  - kind: file
    path: /etc/vsftpd/vsftpd.conf
- id: CK-lnx-U54-001
  type: service_status
  description: 암호화되지 않은 FTP 비활성화 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: vsftpd
    port: 21
    mechanisms:
    - systemd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: vsftpd
- id: CK-lnx-U55-001
  type: account_shell
  description: FTP 계정 로그인 쉘 제한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: account
    source: /etc/passwd
    field: shell
  expect:
    op: in
    value:
    - /bin/false
    - /sbin/nologin
  evidence:
  - kind: account
    path: /etc/passwd
    field: shell
- id: CK-lnx-U56-001
