# Check Specification — Linux Technical Checks
# (Check↔KISA 관계는 data/mappings/kisa-to-check.yaml 에서 관리)
checks:
- id: CK-lnx-U34-001
  type: service_status
  description: Finger 서비스 비활성화 여부 확인
  platforms:
  - linux
  automation: &id001
    observation: auto
    assessment: auto
  targets:
  - kind: service
    name: finger
    port: 79
    mechanisms:
    - inetd
    - xinetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: finger
- id: CK-lnx-U35-001
  type: config_value
  description: 공유 서비스 익명 접근 제한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: config
    path: /etc/samba/smb.conf
  expect:
    op: contains
    value: guest ok = no
  evidence:
  - kind: file
    path: /etc/samba/smb.conf
- id: CK-lnx-U36-001
  type: service_status
  description: r 계열 서비스 비활성화 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: rlogin
    port: 513
    mechanisms:
    - inetd
    - xinetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: rlogin
- id: CK-lnx-U37-001
  type: file_mode
  description: cron/at 설정 파일 권한 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: file
    path: /etc/cron.allow
    field: mode
  expect:
    mode_allowed:
      owner: rw
      group: r
      other: ''
  evidence:
  - kind: file
    path: /etc/cron.allow
    field: mode
- id: CK-lnx-U38-001
  type: service_status
  description: DoS 취약 서비스 비활성화 여부 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
    name: echo
    port: 7
    mechanisms:
    - inetd
    - xinetd
  expect:
    op: eq
    value: disabled
  evidence:
  - kind: service
    field: status
    name: echo
- id: CK-lnx-U39-001
  type: service_status
  description: 불필요한 NFS 서비스 비활성화 확인
  platforms:
  - linux
  automation: *id001
  targets:
  - kind: service
