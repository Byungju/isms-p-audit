# KISA 기술적 취약점 분석·평가 - Linux/Unix 서버 점검 항목
# pass/fail 판단 기준은 원본 가이드의 양호/취약 기준에서 추출
platform: linux
category: 로그 관리
source:
  document: 주요정보통신기반시설 기술적 취약점 분석·평가 방법 상세가이드
  version: 2026
  chapter: 01. Unix 서버
  page: 164
items:
- id: U-65
  name: NTP 및 시각 동기화 설정
  severity: 중
  target: SOLARIS, LINUX, AIX, HP-UX 등
  purpose: 인증 및 감사 목적을 위한 시간 동기화는 필수적이며, 안전하고 승인된 NTP 서비스와 동기화하기 위함
  pass: NTP 및 시각 동기화 설정이 기준에 따라 적용된 경우
  fail: NTP 및 시각 동기화 설정이 기준에 따라 적용되어 있지 않은 경우
  automation: AUTO
  evidence: NTP 설정(/etc/ntp.conf, chrony)
  isms_p:
  - 2.9.6
- id: U-66
  name: 정책에 따른 시스템 로깅 설정
  severity: 중
  target: SOLARIS, LINUX, AIX, HP-UX 등
  purpose: 보안 사고 발생 시 원인 파악 및 각종 침해 사실 확인을 하기 위함
  pass: 로그 기록 정책이 보안 정책에 따라 설정되어 수립되어 있으며, 로그를 남기고 있는 경우
  fail: 로그 기록 정책 미수립 또는 정책에 따라 설정되어 있지 않거나, 로그를 남기고 있지 않은 경우
  automation: SEMI
  evidence: 로깅 설정(rsyslog 등)
  isms_p:
  - 2.9.4
- id: U-67
  name: 로그 디렉터리 소유자 및 권한 설정
  severity: 중
  target: SOLARIS, LINUX, AIX, HP-UX 등
  purpose: 로그 파일을 관리자만 제어할 수 있게 하여 비인가자의 임의적인 파일 훼손 및 변조를 방지하기 위함
  pass: 디렉터리 내 로그 파일의 소유자가 root이고, 권한이 644 이하인 경우
  fail: 디렉터리 내 로그 파일의 소유자가 root가 아니거나, 권한이 644를 초과하는 경우
  automation: AUTO
  evidence: 로그 디렉토리(/var/log) 권한
  isms_p:
  - 2.9.4
